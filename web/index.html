<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191712" media="(prefers-color-scheme: dark)">
<title>系规刷题 · 墨卷</title>
<style>
:root{
  --bg:#f5f1e8; --panel:#fdfbf5; --ink:#2b2620; --muted:#8a8071; --line:#e3dbc9; --line2:#d4c9b0;
  --cinnabar:#b5402c; --cinnabar-deep:#93321f; --cinnabar-soft:#f6e7e1;
  --ok:#3f7d54; --ok-soft:#e9f1e8; --warn:#996a1e; --warn-soft:#f5ecd8;
  --shadow:0 1px 2px rgba(60,48,30,.06),0 6px 20px rgba(60,48,30,.07);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191712; --panel:#211e17; --ink:#e9e2d2; --muted:#9c937e; --line:#373124; --line2:#453d2d;
    --cinnabar:#e06a4f; --cinnabar-deep:#f0876d; --cinnabar-soft:#3a2119;
    --ok:#82c092; --ok-soft:#1f2e1d; --warn:#d9a441; --warn-soft:#332a16;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
  }
}
/* ---------- 主题 ---------- */
/* 玄夜：墨蓝夜空 + 鎏金 */
html[data-theme=xuanye]{
  --bg:#111420; --panel:#191d2b; --ink:#e3e6f0; --muted:#8b91a8; --line:#2a3046; --line2:#39405c;
  --cinnabar:#d9a441; --cinnabar-deep:#e6b95f; --cinnabar-soft:#2c2410;
  --ok:#7fc08f; --ok-soft:#1c2b1e; --warn:#e08a4f; --warn-soft:#33200f;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
}
/* 青瓷：釉色天青 */
html[data-theme=qingci]{
  --bg:#edf2ee; --panel:#fafdfb; --ink:#22302a; --muted:#71847b; --line:#d9e3dc; --line2:#c3d4c9;
  --cinnabar:#247867; --cinnabar-deep:#1b5f52; --cinnabar-soft:#e0efeb;
  --ok:#3f7d54; --ok-soft:#e6f1e6; --warn:#996a1e; --warn-soft:#f3ecd7;
  --shadow:0 1px 2px rgba(30,60,45,.06),0 6px 20px rgba(30,60,45,.07);
}
/* 靛青：文卷靛蓝 */
html[data-theme=dianqing]{
  --bg:#eef1f7; --panel:#fbfcfe; --ink:#212838; --muted:#76809a; --line:#dce1ec; --line2:#c6cede;
  --cinnabar:#2b5aa7; --cinnabar-deep:#20477f; --cinnabar-soft:#e3ebf8;
  --ok:#3f7d54; --ok-soft:#e9f1e8; --warn:#996a1e; --warn-soft:#f5ecd8;
  --shadow:0 1px 2px rgba(30,45,80,.06),0 6px 20px rgba(30,45,80,.07);
}
/* 桃夭：胭脂淡粉 */
html[data-theme=taoyao]{
  --bg:#f8f0ef; --panel:#fefafa; --ink:#33262a; --muted:#96808a; --line:#eddcda; --line2:#dfc6c6;
  --cinnabar:#c2465f; --cinnabar-deep:#a03048; --cinnabar-soft:#f8e3e8;
  --ok:#3f7d54; --ok-soft:#e9f1e8; --warn:#996a1e; --warn-soft:#f5ecd8;
  --shadow:0 1px 2px rgba(90,40,50,.06),0 6px 20px rgba(90,40,50,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(1200px 500px at 50% -100px, rgba(181,64,44,.045), transparent 70%);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px calc(64px + env(safe-area-inset-bottom))}

/* ---------- 页眉 ---------- */
.top{display:flex;align-items:center;gap:12px;padding:10px 0 14px;
  border-bottom:2px solid var(--ink);margin-bottom:22px;flex-wrap:wrap}
.mark{width:40px;height:40px;flex:none;display:grid;place-items:center;
  border:2px solid var(--cinnabar);color:var(--cinnabar);border-radius:6px;
  font:700 15px/1.1 var(--serif);letter-spacing:1px;text-align:center;
  box-shadow:inset 0 0 0 1.5px var(--bg), inset 0 0 0 3px var(--cinnabar);
  transform:rotate(-3deg)}
h1{font:700 21px/1.2 var(--serif);margin:0;letter-spacing:2px}
h1 small{font-size:12px;color:var(--muted);letter-spacing:3px;display:block;font-weight:400;margin-top:2px}
.top .meta{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.5}
.themesel{font:12.5px/1.4 inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line2);
  background:var(--panel);color:var(--muted);cursor:pointer;width:auto}
.count{color:var(--cinnabar);font:700 15px/1 var(--serif)}

/* ---------- 倒计时横幅 ---------- */
.banner{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px;
  padding:14px 18px;border:1px solid var(--line2);border-left:4px solid var(--cinnabar);
  background:var(--panel);border-radius:4px 10px 10px 4px;box-shadow:var(--shadow)}
.banner .days{font:700 40px/1 var(--serif);color:var(--cinnabar);font-variant-numeric:tabular-nums}
.banner .lbl{font-size:13px;color:var(--muted)}
.banner .lbl b{color:var(--ink);font-weight:600}

h2{font:600 16px/1.4 var(--serif);letter-spacing:2px;margin:28px 0 12px;
  display:flex;align-items:center;gap:10px;color:var(--ink)}
h2::after{content:"";flex:1;height:1px;background:var(--line2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel);color:var(--ink);padding:11px 16px;transition:border-color .12s,color .12s,background .12s,transform .06s}
button:hover:not(:disabled){border-color:var(--cinnabar);color:var(--cinnabar)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{cursor:default}
button.primary{background:var(--cinnabar);border-color:var(--cinnabar);color:#fdfbf5;font-weight:600;letter-spacing:1px}
button.primary:hover{background:var(--cinnabar-deep);border-color:var(--cinnabar-deep);color:#fdfbf5}

/* 首页模式卡 */
.mode{text-align:left;padding:16px;position:relative;overflow:hidden}
.mode i{position:absolute;right:10px;top:6px;font:700 44px/1 var(--serif);font-style:normal;
  color:var(--line);transition:color .15s;user-select:none}
.mode:hover i{color:var(--cinnabar-soft)}
.mode b{display:block;font:600 17px/1.3 var(--serif);letter-spacing:1px;margin-bottom:4px;position:relative}
.mode span{color:var(--muted);font-size:13px;line-height:1.55;display:block;position:relative}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.chip{padding:7px 13px;font-size:14px;border-radius:999px}
.chip.on{background:var(--cinnabar-soft);border-color:var(--cinnabar);color:var(--cinnabar);font-weight:600}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:.5px}
select,input[type=number],input[type=password]{font:inherit;padding:10px 11px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel);color:var(--ink);width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:140px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin-top:14px;line-height:1.7}

/* ---------- 答题 ---------- */
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:var(--cinnabar);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);
  font-size:13px;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.qmeta .idx{font:700 17px/1 var(--serif);color:var(--ink)}
.qmeta .idx small{font-size:12px;color:var(--muted);font-weight:400}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.timer.over{color:var(--cinnabar)}
.stem{font-size:17px;line-height:1.85;margin:8px 0 18px;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:3px;margin:0 6px 6px 0;
  background:var(--bg);border:1px solid var(--line2);color:var(--muted)}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;padding:13px 15px;width:100%;
  line-height:1.65;border-radius:8px}
.opt kbd{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);
  display:grid;place-items:center;font:600 13px/1 var(--serif);color:var(--muted);background:transparent;
  transition:.12s}
.opt:hover:not(:disabled) kbd{border-color:var(--cinnabar);color:var(--cinnabar)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right kbd{background:var(--ok);color:#fdfbf5;border-color:var(--ok)}
.opt.wrong{border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.opt.wrong kbd{background:var(--cinnabar);color:#fdfbf5;border-color:var(--cinnabar)}
.opt:disabled{opacity:.92;color:var(--ink)}

.fb{margin-top:16px;padding:12px 15px;border-radius:4px 8px 8px 4px;font-size:14.5px;line-height:1.75}
.fb.ok{background:var(--ok-soft);color:var(--ok);border-left:3px solid var(--ok)}
.fb.no{background:var(--cinnabar-soft);color:var(--cinnabar);border-left:3px solid var(--cinnabar)}
.exp{margin-top:12px;padding:13px 16px;border-radius:4px 8px 8px 4px;background:var(--bg);
  border-left:3px solid var(--line2);color:var(--muted);font-size:14px;line-height:1.85}
.exp b{color:var(--ink);font-family:var(--serif);letter-spacing:1px}

/* ---------- 结果 ---------- */
.rhead{position:relative;padding-right:110px}
.big{font:700 52px/1.1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:1px}
.big small{font-size:20px;letter-spacing:0}
.seal{position:absolute;right:6px;top:2px;transform:rotate(-8deg);
  border:2.5px solid var(--cinnabar);color:var(--cinnabar);border-radius:6px;
  padding:8px 12px;font:700 20px/1.2 var(--serif);letter-spacing:4px;text-align:center;
  box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3.5px var(--cinnabar);opacity:.9;user-select:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font:700 20px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;line-height:1.5;display:block}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12.5px;letter-spacing:.5px}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wrongx{display:inline-block;min-width:34px;text-align:center;font-size:12px;padding:2px 6px;
  border-radius:3px;background:var(--cinnabar-soft);color:var(--cinnabar);font-weight:600}
.scroll{overflow-x:auto}
.hidden{display:none!important}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.spark{width:100%;height:72px;display:block;margin:4px 0 8px}

/* ---------- 口令层 ---------- */
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
.gate .card{max-width:340px;width:100%}
.gate h1{margin-bottom:8px}
.gate .err{color:var(--cinnabar);font-size:13px;min-height:20px;margin-top:8px}

@media (max-width:560px){
  .banner .days{font-size:32px}
  .actions button{flex:1;min-width:110px;padding:13px 10px}
  .big{font-size:42px}
  .rhead{padding-right:96px}
  .seal{font-size:16px;letter-spacing:3px;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="mark">系规</div>
    <h1>刷题 · 墨卷<small>系统规划与管理师 · 综合知识</small></h1>
    <div class="meta" id="topmeta">加载中…</div>
    <select id="themesel" class="themesel" title="主题">
      <option value="">墨卷（随系统深浅）</option>
      <option value="xuanye">玄夜 · 墨蓝鎏金</option>
      <option value="qingci">青瓷 · 釉色天青</option>
      <option value="dianqing">靛青 · 文卷蓝</option>
      <option value="taoyao">桃夭 · 胭脂粉</option>
    </select>
  </div>

  <!-- 首页 -->
  <section id="home">
    <div class="banner">
      <span class="days" id="cdays">—</span>
      <span class="lbl">天后机考<br><b>2026-10-24 ~ 10-27</b> · 三科同考 · 每科满分 75 / 及格 45</span>
    </div>

    <div class="grid">
      <button class="mode card" data-mode="practice"><i>壹</i><b>自由练习</b><span>按题型 / 年份 / 章节筛选，可设题数与顺序</span></button>
      <button class="mode card" data-mode="wrong"><i>贰</i><b>错题本</b><span id="wrongdesc">连续答对 2 次自动移出</span></button>
      <button class="mode card" data-mode="exam"><i>叁</i><b>限时模考</b><span>75 题 / 75 分钟，只抽真题与模拟卷</span></button>
      <button class="mode card" data-mode="stats"><i>肆</i><b>统计</b><span>正确率走势、练习历史、错题分布</span></button>
    </div>

    <div id="filters" class="card hidden" style="margin-top:16px">
      <label>题型</label>
      <div class="chips" id="typechips"></div>
      <div class="row" style="margin-top:8px">
        <div><label>来源 / 年份</label><select id="yearsel"></select></div>
        <div><label>章节（老教材）</label><select id="chsel"></select></div>
        <div style="max-width:120px"><label>题数（0=全部）</label><input type="number" id="count" value="20" min="0" max="600"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <div style="max-width:160px"><label>顺序</label>
          <select id="ordersel"><option value="random">随机</option><option value="seq">按题号</option></select></div>
        <div style="max-width:160px"><label>答后显示解析</label>
          <select id="expsel"><option value="1">显示</option><option value="0">不显示</option></select></div>
      </div>
      <div class="actions">
        <button class="primary" id="startbtn">开 始</button>
        <button id="cancelbtn">取消</button>
      </div>
      <div class="hint">提示：第 4-8 章共 102 题对应新教材第 12 章「信息系统服务管理」，是这批老资料里最值钱的部分。</div>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="hidden">
    <div class="qmeta">
      <div class="idx"><span id="qidx"></span> <small id="qsrc"></small></div>
      <div class="timer" id="timer">00:00</div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div id="qtags"></div>
      <div class="stem" id="stem"></div>
      <div class="opts" id="opts"></div>
      <div id="fb"></div>
      <div class="actions">
        <button class="primary hidden" id="nextbtn">下一题 →</button>
        <button id="skipbtn">跳过</button>
        <button id="quitbtn">交卷统计</button>
      </div>
      <div class="hint">键盘：<b>A/B/C/D</b> 或 <b>1/2/3/4</b> 作答　<b>Enter</b> 下一题　<b>Esc</b> 交卷</div>
    </div>
  </section>

  <!-- 结果 -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="rhead">
        <div style="color:var(--muted);font-size:13.5px" id="rmode"></div>
        <div class="big" id="rate"></div>
        <div id="verdict" style="margin-top:6px;font-size:14.5px"></div>
        <div class="seal" id="seal"></div>
      </div>
      <div class="stats" id="rstats"></div>
      <div class="actions">
        <button class="primary" id="againbtn">再来一组</button>
        <button id="towrongbtn">刷错题本</button>
        <button id="homebtn">返回首页</button>
      </div>
    </div>
    <div id="rwrong"></div>
  </section>

  <!-- 统计 -->
  <section id="stats" class="hidden">
    <div class="card">
      <div class="stats" id="lifetime"></div>
      <h2>正确率走势</h2>
      <svg class="spark" id="spark" viewBox="0 0 400 72" preserveAspectRatio="none"></svg>
      <h2>最近练习</h2>
      <div class="scroll"><table id="histtbl"></table></div>
      <h2>错题本（错得最多的在前）</h2>
      <div class="scroll"><table id="wrongtbl"></table></div>
      <div class="actions"><button id="statshome">返回首页</button></div>
    </div>
  </section>

</div>

<!-- 口令 -->
<div class="gate hidden" id="gate">
  <div class="card">
    <div class="top" style="border-bottom:none;padding-bottom:0;margin-bottom:4px">
      <div class="mark">系规</div><h1>刷题 · 墨卷</h1>
    </div>
    <label style="margin-top:12px">访问口令</label>
    <input type="password" id="tokeninput" autocomplete="current-password" placeholder="服务器启动时设置的 QUIZ_TOKEN">
    <div class="err" id="gateerr"></div>
    <div class="actions" style="margin-top:6px"><button class="primary" id="gatebtn" style="width:100%">进 入</button></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const show = id => ['home','quiz','result','stats'].forEach(s => $('#'+s).classList.toggle('hidden', s !== id));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const mmss = s => pad(Math.floor(s/60)) + ':' + pad(Math.floor(s%60));

// ---------- 主题 ----------
const savedTheme = localStorage.getItem('quizTheme') || '';
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#themesel').value = savedTheme;
$('#themesel').onchange = e => {
  const v = e.target.value;
  if(v) document.documentElement.dataset.theme = v;
  else delete document.documentElement.dataset.theme;
  localStorage.setItem('quizTheme', v);
};

const EXAM_DATE = '2026-10-24';
$('#cdays').textContent = Math.max(0, Math.ceil((new Date(EXAM_DATE) - new Date(new Date().toDateString())) / 864e5));

let SUM = null, S = null;   // SUM=题库摘要, S=本次会话

// ---------- 口令 ----------
let TOKEN = localStorage.getItem('quizToken') || '';
function gate(showIt){
  $('#gate').classList.toggle('hidden', !showIt);
  if(showIt){ $('#tokeninput').focus(); }
}
$('#gatebtn').onclick = async () => {
  TOKEN = $('#tokeninput').value.trim();
  try{
    await api('/api/summary');
    localStorage.setItem('quizToken', TOKEN);
    gate(false); refresh();
  }catch(e){ $('#gateerr').textContent = e.status === 401 ? '口令不对，再试试。' : '连接失败：' + e.message; }
};
$('#tokeninput').addEventListener('keydown', e => { if(e.key === 'Enter') $('#gatebtn').click(); });

async function api(p, body){
  const headers = {'Content-Type':'application/json'};
  if(TOKEN) headers['X-Quiz-Token'] = TOKEN;
  const r = await fetch(p, body ? {method:'POST',headers,body:JSON.stringify(body)} : {headers});
  if(!r.ok){
    const err = new Error('请求失败 ' + r.status);
    err.status = r.status;
    if(r.status === 401) gate(true);
    throw err;
  }
  return r.json();
}

async function refresh(){
  SUM = await api('/api/summary');
  $('#topmeta').innerHTML = `题库 <span class="count">${SUM.total}</span> 题<br>错题本 <span class="count">${SUM.wrongCount}</span> 题`;
  $('#wrongdesc').textContent = SUM.wrongCount
    ? `${SUM.wrongCount} 题待复习 · 连续答对 ${SUM.graduate} 次自动移出`
    : `暂无错题 · 答错会自动记入`;
}

// ---------- 首页筛选 ----------
let filter = {type:null, year:'', chapter:'', mode:'practice'};

function renderFilters(){
  const tc = $('#typechips');
  tc.innerHTML = '';
  const mk = (label, val, n) => {
    const b = document.createElement('button');
    b.className = 'chip' + (filter.type === val ? ' on' : '');
    b.textContent = n == null ? label : `${label} ${n}`;
    b.onclick = () => { filter.type = val; filter.year=''; filter.chapter=''; renderFilters(); };
    tc.appendChild(b);
  };
  mk('全部', null, SUM.total);
  Object.entries(SUM.byType).forEach(([t,n]) => mk(t, t, n));

  const ys = $('#yearsel');
  ys.innerHTML = '<option value="">不限</option>';
  Object.entries(SUM.byYear).forEach(([y,n]) => {
    const o = document.createElement('option'); o.value = y; o.textContent = `${y}（${n}）`;
    ys.appendChild(o);
  });
  ys.value = filter.year;

  const cs = $('#chsel');
  cs.innerHTML = '<option value="">不限</option>';
  Object.entries(SUM.byChapter).sort((a,b)=>a[0]-b[0]).forEach(([c,n]) => {
    const o = document.createElement('option'); o.value = c; o.textContent = `第 ${c} 章（${n}）`;
    cs.appendChild(o);
  });
  cs.value = filter.chapter;
}

document.querySelectorAll('.mode').forEach(b => b.onclick = async () => {
  const m = b.dataset.mode;
  if(m === 'stats') return renderStats();
  if(m === 'practice'){ filter.mode='practice'; renderFilters(); $('#filters').classList.remove('hidden'); $('#filters').scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
  start({mode:m});
});
$('#cancelbtn').onclick = () => $('#filters').classList.add('hidden');
$('#startbtn').onclick = () => start({
  mode:'practice', type:filter.type, year:$('#yearsel').value,
  chapter:$('#chsel').value, count:+$('#count').value||0, order:$('#ordersel').value
});

// ---------- 答题 ----------
async function start(opt){
  const r = await api('/api/quiz', opt);
  if(!r.list.length){
    alert(opt.mode === 'wrong' ? '错题本是空的 —— 目前没有做错的题。' : '筛选后没有题目，换个条件试试。');
    return;
  }
  S = {
    list:r.list, i:0, correct:0, answered:0, skipped:0, locked:false,
    mode:opt.mode, exam:opt.mode === 'exam',
    explain: opt.mode === 'exam' ? false : $('#expsel').value === '1',
    t0:Date.now(), newWrong:0, wrongList:[],
    label: opt.mode==='exam' ? '限时模考' : opt.mode==='wrong' ? '错题本'
         : (opt.type||'') + (opt.chapter?`第${opt.chapter}章`:'') + (opt.year||'') + r.list.length + '题'
  };
  show('quiz');
  tick();
  render();
}

let timerId = null;
function tick(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    if(!S) return;
    const el = (Date.now()-S.t0)/1000;
    const t = $('#timer');
    if(S.exam){
      const left = 75*60 - el;
      t.textContent = (left<0?'超时 ':'') + mmss(Math.abs(left));
      t.classList.toggle('over', left < 0);
    } else t.textContent = mmss(el);
  }, 500);
}

function render(){
  const q = S.list[S.i];
  S.locked = false;
  $('#prog').style.width = (S.i / S.list.length * 100) + '%';
  $('#qidx').textContent = `${S.i+1} / ${S.list.length}`;
  $('#qsrc').textContent = `· ${q.year} 第 ${q.num} 题`;
  $('#stem').textContent = q.stem;
  $('#fb').innerHTML = '';
  $('#nextbtn').classList.add('hidden');
  $('#skipbtn').classList.remove('hidden');

  let tags = `<span class="tag">${esc(q.type||'')}</span>`;
  if(q.chapter) tags += `<span class="tag">第${q.chapter}章</span>`;
  if(q.needsFigure) tags += `<span class="tag warn">⚠ 本题引用图表，文字版不完整，请对照原 PDF：${esc(q.source)}</span>`;
  $('#qtags').innerHTML = tags;

  const box = $('#opts'); box.innerHTML = '';
  ['A','B','C','D'].forEach(L => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.letter = L;
    b.innerHTML = `<kbd>${L}</kbd><span>${esc(q.options[L])}</span>`;
    b.onclick = () => answer(L);
    box.appendChild(b);
  });
}

async function answer(L){
  if(S.locked) return;
  S.locked = true;
  const q = S.list[S.i];
  let r;
  try{ r = await api('/api/answer', {id:q.id, pick:L}); }
  catch(e){ S.locked = false; return; }
  S.answered++;
  if(r.correct) S.correct++; else { S.newWrong++; S.wrongList.push(q); }

  document.querySelectorAll('.opt').forEach(el => {
    const l = el.dataset.letter;
    if(l === r.answer) el.classList.add('right');
    if(l === L && !r.correct) el.classList.add('wrong');
    el.disabled = true;
  });

  let msg;
  if(r.correct){
    msg = `<div class="fb ok">✓ 正确`;
    if(r.graduated) msg += `　—— 连续答对 ${r.graduate} 次，已移出错题本 🎉`;
    else if(r.streak) msg += `　—— 错题本：连续答对 ${r.streak}/${r.graduate} 次后移出`;
    msg += `</div>`;
  } else {
    msg = `<div class="fb no">✗ 错误　你选 ${L}，正确答案 <b>${r.answer}</b> —— 已记入错题本</div>`;
  }
  if(S.explain && r.explanation) msg += `<div class="exp"><b>解析</b><br>${esc(r.explanation)}</div>`;
  $('#fb').innerHTML = msg;
  $('#nextbtn').classList.remove('hidden');
  $('#skipbtn').classList.add('hidden');
  $('#topmeta').innerHTML = `题库 <span class="count">${SUM.total}</span> 题<br>错题本 <span class="count">${r.wrongCount}</span> 题`;
}

function next(){
  if(S.i + 1 >= S.list.length) return finish();
  S.i++; render();
  window.scrollTo({top:0, behavior:'smooth'});
}
$('#nextbtn').onclick = next;
$('#skipbtn').onclick = () => { S.skipped++; next(); };
$('#quitbtn').onclick = () => finish();

// ---------- 结果 ----------
async function finish(){
  clearInterval(timerId);
  const mins = (Date.now()-S.t0)/60000;
  try{ await api('/api/finish', {mode:S.label, total:S.answered, correct:S.correct, minutes:mins}); }catch(e){}
  const rate = S.answered ? S.correct/S.answered*100 : 0;
  const col = rate>=70?'var(--ok)':rate>=60?'var(--warn)':'var(--cinnabar)';

  $('#rmode').textContent = S.label;
  $('#rate').innerHTML = S.answered ? `<span style="color:${col}">${rate.toFixed(1)}<small>%</small></span>` : '—';
  $('#verdict').innerHTML = !S.answered ? '<span style="color:var(--muted)">本次没有作答</span>'
    : rate>=70 ? '<span style="color:var(--ok)">稳了，保持这个水平。</span>'
    : rate>=60 ? '<span style="color:var(--warn)">刚过及格线，还有提升空间。</span>'
    : '<span style="color:var(--cinnabar)">低于及格线，建议回教材对应章节再过一遍。</span>';
  const seal = $('#seal');
  if(S.answered){
    seal.style.display = '';
    seal.textContent = rate>=80 ? '优' : rate>=70 ? '良' : rate>=60 ? '及格' : '再练';
  } else seal.style.display = 'none';

  const per = S.answered ? mins*60/S.answered : 0;
  $('#rstats').innerHTML = [
    ['作答', S.answered + ' 题'],
    ['正确', S.correct + ' 题'],
    ['跳过', S.skipped + ' 题'],
    ['折算卷面', Math.round(rate/100*75) + ' 分', '满分 75 · 及格 45'],
    ['用时', mins.toFixed(1) + ' 分'],
    ['每题', per.toFixed(0) + ' 秒', '考试节奏 60 秒/题'],
    ['新增错题', S.newWrong + ' 题'],
  ].map(([k,v,s]) => `<div class="stat"><b>${v}</b><span>${k}${s?' · '+s:''}</span></div>`).join('');

  $('#rwrong').innerHTML = S.wrongList.length ? `<div class="card" style="margin-top:16px">
    <h2 style="margin-top:0">本次做错的 ${S.wrongList.length} 题</h2>
    <div class="scroll"><table><tr><th>来源</th><th>题干</th><th>答案</th></tr>
    ${S.wrongList.map(q=>`<tr><td style="white-space:nowrap">${esc(q.year)} #${q.num}</td><td>${esc(q.stem.slice(0,60))}${q.stem.length>60?'…':''}</td><td><b>${q.answer}</b></td></tr>`).join('')}
    </table></div></div>` : '';

  await refresh();
  show('result');
  window.scrollTo({top:0});
}
$('#homebtn').onclick = () => { show('home'); $('#filters').classList.add('hidden'); };
$('#againbtn').onclick = () => show('home');
$('#towrongbtn').onclick = () => start({mode:'wrong'});
$('#statshome').onclick = () => show('home');

// ---------- 统计 ----------
function sparkline(hist){
  const svg = $('#spark');
  const H = hist.filter(h => h.total > 0);
  if(H.length < 2){ svg.innerHTML = `<text x="200" y="40" text-anchor="middle" fill="var(--muted)" font-size="13">练习两次以上才有走势图</text>`; return; }
  const W = 400, HT = 72, padX = 4, padY = 8;
  const xs = i => padX + i * (W - 2*padX) / (H.length - 1);
  const ys = r => padY + (1 - r/100) * (HT - 2*padY);
  const pts = H.map((h,i) => [xs(i), ys(h.correct/h.total*100)]);
  const line = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  svg.innerHTML = `
    <line x1="0" x2="${W}" y1="${ys(70)}" y2="${ys(70)}" stroke="var(--ok)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
    <line x1="0" x2="${W}" y1="${ys(60)}" y2="${ys(60)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
    <path d="${line}L${W-padX},${HT}L${padX},${HT}Z" fill="var(--cinnabar)" opacity=".08"/>
    <path d="${line}" fill="none" stroke="var(--cinnabar)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--cinnabar)"/>`).join('')}
    <text x="${W-6}" y="${ys(70)-4}" text-anchor="end" fill="var(--ok)" font-size="10">70%</text>
    <text x="${W-6}" y="${ys(60)+12}" text-anchor="end" fill="var(--warn)" font-size="10">60%</text>`;
}

async function renderStats(){
  await refresh();
  const lt = SUM.lifetime;
  const rate = lt.t ? lt.c/lt.t*100 : 0;
  const col = rate>=70?'var(--ok)':rate>=60?'var(--warn)':'var(--cinnabar)';
  $('#lifetime').innerHTML = [
    ['题库', SUM.total + ' 题'],
    ['累计作答', lt.t + ' 题'],
    ['累计正确率', lt.t ? `<span style="color:${col}">${rate.toFixed(1)}%</span>` : '—', '目标 ≥70%'],
    ['错题本', SUM.wrongCount + ' 题'],
  ].map(([k,v,s]) => `<div class="stat"><b>${v}</b><span>${k}${s?' · '+s:''}</span></div>`).join('');

  sparkline(SUM.history);

  const H = SUM.history.slice().reverse();
  $('#histtbl').innerHTML = H.length
    ? `<tr><th>日期</th><th>模式</th><th>正确率</th><th class="num">得分</th><th class="num">用时</th></tr>` +
      H.map(h=>{
        const r = h.total ? h.correct/h.total*100 : 0;
        const c = r>=70?'var(--ok)':r>=60?'var(--warn)':'var(--cinnabar)';
        const w = Math.max(2, Math.round(r));
        return `<tr><td style="white-space:nowrap">${esc(h.date)}</td><td>${esc(h.mode)}</td>
          <td><div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;max-width:110px;height:6px;background:var(--line);border-radius:3px;overflow:hidden">
              <i style="display:block;height:100%;width:${w}%;background:${c}"></i></div>
            <span style="color:${c};font-variant-numeric:tabular-nums">${r.toFixed(0)}%</span></div></td>
          <td class="num">${h.correct}/${h.total}</td><td class="num">${(h.minutes||0).toFixed(1)}分</td></tr>`;
      }).join('')
    : '<tr><td class="empty">还没有练习记录</td></tr>';

  const W = SUM.wrongItems;
  $('#wrongtbl').innerHTML = W.length
    ? `<tr><th class="num">错次</th><th>来源</th><th>题干</th><th>上次</th></tr>` +
      W.slice(0,60).map(w=>`<tr><td class="num"><span class="wrongx">×${w.wrongCount}</span></td>
        <td style="white-space:nowrap">${esc(w.year)}</td><td>${esc((w.stem||'').slice(0,52))}${(w.stem||'').length>52?'…':''}</td>
        <td style="color:var(--muted);white-space:nowrap">${esc(w.lastWrong||'')}</td></tr>`).join('')
    : '<tr><td class="empty">错题本是空的</td></tr>';

  show('stats');
  window.scrollTo({top:0});
}

// ---------- 键盘 ----------
document.addEventListener('keydown', e => {
  if($('#quiz').classList.contains('hidden')) return;
  if(!$('#gate').classList.contains('hidden')) return;
  const k = e.key.toUpperCase();
  if(!S) return;
  if(!S.locked && ['A','B','C','D'].includes(k)){ e.preventDefault(); answer(k); }
  else if(!S.locked && ['1','2','3','4'].includes(k)){ e.preventDefault(); answer('ABCD'[+k-1]); }
  else if(k === 'ENTER' || k === ' '){ e.preventDefault(); if(S.locked) next(); }
  else if(k === 'ESCAPE'){ e.preventDefault(); finish(); }
});

refresh().catch(e => { if(e.status !== 401) $('#topmeta').textContent = '加载失败：' + e.message; });
</script>
