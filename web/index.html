<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系规刷题</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e3e6ea;
  --brand:#2563eb; --brand-soft:#eff4ff;
  --ok:#15803d; --ok-soft:#eaf6ee; --bad:#b91c1c; --bad-soft:#fdecec;
  --warn:#b45309; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1216; --panel:#171b21; --ink:#e6e9ee; --muted:#9aa4b2; --line:#262c35;
    --brand:#5b91ff; --brand-soft:#16233c;
    --ok:#4ade80; --ok-soft:#132a1d; --bad:#f87171; --bad-soft:#2c1618;
    --warn:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
h2{font-size:17px;margin:26px 0 12px;color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.top .meta{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:11px 16px;transition:.12s}
button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
button:disabled{cursor:default;opacity:.6}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{filter:brightness(1.08);color:#fff}
.mode{text-align:left;padding:16px}
.mode b{display:block;font-size:16px;margin-bottom:3px}
.mode span{color:var(--muted);font-size:13px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:7px 13px;font-size:14px;border-radius:999px}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
select,input[type=number]{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:150px}

/* 答题界面 */
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:16px;
  flex-wrap:wrap;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.over{color:var(--bad)}
.stem{font-size:17.5px;line-height:1.8;margin:6px 0 18px;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);margin-right:6px;vertical-align:2px}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 15px;width:100%;line-height:1.65}
.opt kbd{flex:none;width:25px;height:25px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font:600 13px/1 inherit;color:var(--muted)}
.opt.pick{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right kbd{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong kbd{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{margin-top:16px;padding:13px 15px;border-radius:10px;font-size:14.5px;line-height:1.75}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.exp{margin-top:12px;padding:13px 15px;border-radius:10px;background:var(--bg);
  border:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.8}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin-top:14px}

/* 结果 */
.big{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:18px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto}
.hidden{display:none}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>系规刷题</h1>
    <div class="meta" id="topmeta">加载中…</div>
  </div>

  <!-- 首页 -->
  <section id="home">
    <div class="grid">
      <button class="mode card" data-mode="practice"><b>自由练习</b><span>按题型 / 年份 / 章节筛选，可设题数</span></button>
      <button class="mode card" data-mode="wrong"><b>错题本</b><span id="wrongdesc">连续答对 2 次自动移出</span></button>
      <button class="mode card" data-mode="exam"><b>限时模考</b><span>75 题 / 75 分钟，只抽真题与模拟卷</span></button>
      <button class="mode card" data-mode="stats"><b>统计</b><span>正确率曲线、错题分布</span></button>
    </div>

    <div id="filters" class="card hidden" style="margin-top:16px">
      <label>题型</label>
      <div class="chips" id="typechips"></div>
      <div class="row" style="margin-top:6px">
        <div><label>来源 / 年份</label><select id="yearsel"></select></div>
        <div><label>章节（老教材）</label><select id="chsel"></select></div>
        <div style="max-width:130px"><label>题数（0=全部）</label><input type="number" id="count" value="20" min="0" max="600"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <div style="max-width:170px"><label>顺序</label>
          <select id="ordersel"><option value="random">随机</option><option value="seq">按题号</option></select></div>
        <div style="max-width:170px"><label>答后显示解析</label>
          <select id="expsel"><option value="1">显示</option><option value="0">不显示</option></select></div>
      </div>
      <div class="actions">
        <button class="primary" id="startbtn">开始</button>
        <button id="cancelbtn">取消</button>
      </div>
      <div class="hint" id="poolhint"></div>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="qmeta">
      <div><span id="qidx"></span> · <span id="qsrc"></span></div>
      <div class="timer" id="timer">00:00</div>
    </div>
    <div class="card">
      <div id="qtags"></div>
      <div class="stem" id="stem"></div>
      <div class="opts" id="opts"></div>
      <div id="fb"></div>
      <div class="actions">
        <button class="primary hidden" id="nextbtn">下一题 →</button>
        <button id="skipbtn">跳过</button>
        <button id="quitbtn">结束并统计</button>
      </div>
      <div class="hint">键盘：<b>A/B/C/D</b> 或 <b>1/2/3/4</b> 作答　<b>Enter</b> 下一题　<b>Esc</b> 结束</div>
    </div>
  </section>

  <!-- 结果 -->
  <section id="result" class="hidden">
    <div class="card">
      <div style="color:var(--muted);font-size:14px" id="rmode"></div>
      <div class="big" id="rate"></div>
      <div id="verdict" style="margin-top:6px"></div>
      <div class="stats" id="rstats"></div>
      <div class="actions">
        <button class="primary" id="againbtn">再来一组</button>
        <button id="towrongbtn">刷错题本</button>
        <button id="homebtn">返回首页</button>
      </div>
    </div>
    <div id="rwrong"></div>
  </section>

  <!-- 统计 -->
  <section id="stats" class="hidden">
    <div class="card">
      <div class="stats" id="lifetime"></div>
      <h2 style="margin-top:6px">最近练习</h2>
      <div class="scroll"><table id="histtbl"></table></div>
      <h2>错题本（错得最多的在前）</h2>
      <div class="scroll"><table id="wrongtbl"></table></div>
      <div class="actions"><button id="statshome">返回首页</button></div>
    </div>
  </section>

</div>
<script>
const $ = s => document.querySelector(s);
const show = id => ['home','quiz','result','stats'].forEach(s => $('#'+s).classList.toggle('hidden', s !== id));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const mmss = s => pad(Math.floor(s/60)) + ':' + pad(Math.floor(s%60));

let SUM = null, S = null;   // SUM=题库摘要, S=本次会话

async function api(p, body){
  const r = await fetch(p, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  if(!r.ok) throw new Error('请求失败 ' + r.status);
  return r.json();
}

async function refresh(){
  SUM = await api('/api/summary');
  $('#topmeta').textContent = `题库 ${SUM.total} 题 · 错题本 ${SUM.wrongCount} 题`;
  $('#wrongdesc').textContent = SUM.wrongCount
    ? `${SUM.wrongCount} 题待复习 · 连续答对 ${SUM.graduate} 次自动移出`
    : `暂无错题 · 答错会自动记入`;
}

// ---------- 首页筛选 ----------
let filter = {type:null, year:'', chapter:'', mode:'practice'};

function renderFilters(){
  const tc = $('#typechips');
  tc.innerHTML = '';
  const mk = (label, val, n) => {
    const b = document.createElement('button');
    b.className = 'chip' + (filter.type === val ? ' on' : '');
    b.textContent = n == null ? label : `${label} ${n}`;
    b.onclick = () => { filter.type = val; filter.year=''; filter.chapter=''; renderFilters(); };
    tc.appendChild(b);
  };
  mk('全部', null, SUM.total);
  Object.entries(SUM.byType).forEach(([t,n]) => mk(t, t, n));

  const ys = $('#yearsel');
  ys.innerHTML = '<option value="">不限</option>';
  Object.entries(SUM.byYear).forEach(([y,n]) => {
    if(filter.type && !Object.keys(SUM.byYear).length) return;
    const o = document.createElement('option'); o.value = y; o.textContent = `${y}（${n}）`;
    ys.appendChild(o);
  });
  ys.value = filter.year;

  const cs = $('#chsel');
  cs.innerHTML = '<option value="">不限</option>';
  Object.entries(SUM.byChapter).sort((a,b)=>a[0]-b[0]).forEach(([c,n]) => {
    const o = document.createElement('option'); o.value = c; o.textContent = `第 ${c} 章（${n}）`;
    cs.appendChild(o);
  });
  cs.value = filter.chapter;
  $('#poolhint').textContent = '提示：第 4-8 章共 102 题对应新教材第 12 章「信息系统服务管理」，是这批老资料里最值钱的部分。';
}

document.querySelectorAll('.mode').forEach(b => b.onclick = async () => {
  const m = b.dataset.mode;
  if(m === 'stats') return renderStats();
  if(m === 'practice'){ filter.mode='practice'; renderFilters(); $('#filters').classList.remove('hidden'); $('#filters').scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
  start({mode:m});
});
$('#cancelbtn').onclick = () => $('#filters').classList.add('hidden');
$('#startbtn').onclick = () => start({
  mode:'practice', type:filter.type, year:$('#yearsel').value,
  chapter:$('#chsel').value, count:+$('#count').value||0, order:$('#ordersel').value
});

// ---------- 答题 ----------
async function start(opt){
  const r = await api('/api/quiz', opt);
  if(!r.list.length){
    alert(opt.mode === 'wrong' ? '错题本是空的 —— 目前没有做错的题。' : '筛选后没有题目，换个条件试试。');
    return;
  }
  S = {
    list:r.list, i:0, correct:0, answered:0, skipped:0, locked:false,
    mode:opt.mode, exam:opt.mode === 'exam',
    explain: opt.mode === 'exam' ? false : $('#expsel').value === '1',
    t0:Date.now(), newWrong:0, wrongList:[],
    label: opt.mode==='exam' ? '限时模考' : opt.mode==='wrong' ? '错题本'
         : (opt.type||'') + (opt.chapter?`第${opt.chapter}章`:'') + (opt.year||'') + r.list.length + '题'
  };
  show('quiz');
  tick();
  render();
}

let timerId = null;
function tick(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    if(!S) return;
    const el = (Date.now()-S.t0)/1000;
    const t = $('#timer');
    if(S.exam){
      const left = 75*60 - el;
      t.textContent = (left<0?'超时 ':'') + mmss(Math.abs(left));
      t.classList.toggle('over', left < 0);
    } else t.textContent = mmss(el);
  }, 500);
}

function render(){
  const q = S.list[S.i];
  S.locked = false;
  $('#prog').style.width = (S.i / S.list.length * 100) + '%';
  $('#qidx').textContent = `${S.i+1} / ${S.list.length}`;
  $('#qsrc').textContent = `${q.year} 第 ${q.num} 题`;
  $('#stem').textContent = q.stem;
  $('#fb').innerHTML = '';
  $('#nextbtn').classList.add('hidden');
  $('#skipbtn').classList.remove('hidden');

  let tags = `<span class="tag">${esc(q.type||'')}</span>`;
  if(q.chapter) tags += `<span class="tag">第${q.chapter}章</span>`;
  if(q.needsFigure) tags += `<span class="tag warn">⚠ 本题引用图表，文字版不完整，请对照原 PDF：${esc(q.source)}</span>`;
  $('#qtags').innerHTML = tags;

  const box = $('#opts'); box.innerHTML = '';
  ['A','B','C','D'].forEach(L => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.letter = L;
    b.innerHTML = `<kbd>${L}</kbd><span>${esc(q.options[L])}</span>`;
    b.onclick = () => answer(L);
    box.appendChild(b);
  });
}

async function answer(L){
  if(S.locked) return;
  S.locked = true;
  const q = S.list[S.i];
  const r = await api('/api/answer', {id:q.id, pick:L});
  S.answered++;
  if(r.correct) S.correct++; else { S.newWrong++; S.wrongList.push(q); }

  document.querySelectorAll('.opt').forEach(el => {
    const l = el.dataset.letter;
    if(l === r.answer) el.classList.add('right');
    if(l === L && !r.correct) el.classList.add('wrong');
    el.disabled = true;
  });

  let msg;
  if(r.correct){
    msg = `<div class="fb ok">✓ 正确`;
    if(r.graduated) msg += `　—— 连续答对 ${r.graduate} 次，已移出错题本 🎉`;
    else if(r.streak) msg += `　—— 错题本：连续答对 ${r.streak}/${r.graduate} 次后移出`;
    msg += `</div>`;
  } else {
    msg = `<div class="fb no">✗ 错误　你选 ${L}，正确答案 <b>${r.answer}</b> —— 已记入错题本</div>`;
  }
  if(S.explain && r.explanation) msg += `<div class="exp"><b>解析</b><br>${esc(r.explanation)}</div>`;
  $('#fb').innerHTML = msg;
  $('#nextbtn').classList.remove('hidden');
  $('#skipbtn').classList.add('hidden');
  $('#topmeta').textContent = `题库 ${SUM.total} 题 · 错题本 ${r.wrongCount} 题`;
}

function next(){
  if(S.i + 1 >= S.list.length) return finish();
  S.i++; render();
  window.scrollTo({top:0, behavior:'smooth'});
}
$('#nextbtn').onclick = next;
$('#skipbtn').onclick = () => { S.skipped++; next(); };
$('#quitbtn').onclick = () => finish();

// ---------- 结果 ----------
async function finish(){
  clearInterval(timerId);
  const mins = (Date.now()-S.t0)/60000;
  await api('/api/finish', {mode:S.label, total:S.answered, correct:S.correct, minutes:mins});
  const rate = S.answered ? S.correct/S.answered*100 : 0;
  const col = rate>=70?'var(--ok)':rate>=60?'var(--warn)':'var(--bad)';

  $('#rmode').textContent = S.label;
  $('#rate').innerHTML = S.answered ? `<span style="color:${col}">${rate.toFixed(1)}%</span>` : '—';
  $('#verdict').innerHTML = !S.answered ? '<span style="color:var(--muted)">本次没有作答</span>'
    : rate>=70 ? '<span style="color:var(--ok)">稳了，保持这个水平。</span>'
    : rate>=60 ? '<span style="color:var(--warn)">刚过及格线，还有提升空间。</span>'
    : '<span style="color:var(--bad)">低于及格线，建议回教材对应章节再过一遍。</span>';

  const per = S.answered ? mins*60/S.answered : 0;
  $('#rstats').innerHTML = [
    ['作答', S.answered + ' 题'],
    ['正确', S.correct + ' 题'],
    ['跳过', S.skipped + ' 题'],
    ['折算卷面', Math.round(rate/100*75) + ' 分', '满分 75 · 及格 45'],
    ['用时', mins.toFixed(1) + ' 分'],
    ['每题', per.toFixed(0) + ' 秒', '考试节奏 60 秒/题'],
    ['新增错题', S.newWrong + ' 题'],
  ].map(([k,v,s]) => `<div class="stat"><b>${v}</b><span>${k}${s?' · '+s:''}</span></div>`).join('');

  $('#rwrong').innerHTML = S.wrongList.length ? `<div class="card" style="margin-top:16px">
    <h2 style="margin-top:0">本次做错的 ${S.wrongList.length} 题</h2>
    <div class="scroll"><table><tr><th>来源</th><th>题干</th><th>答案</th></tr>
    ${S.wrongList.map(q=>`<tr><td>${esc(q.year)} #${q.num}</td><td>${esc(q.stem.slice(0,60))}${q.stem.length>60?'…':''}</td><td><b>${q.answer}</b></td></tr>`).join('')}
    </table></div></div>` : '';

  await refresh();
  show('result');
  window.scrollTo({top:0});
}
$('#homebtn').onclick = () => { show('home'); $('#filters').classList.add('hidden'); };
$('#againbtn').onclick = () => show('home');
$('#towrongbtn').onclick = () => start({mode:'wrong'});
$('#statshome').onclick = () => show('home');

// ---------- 统计 ----------
async function renderStats(){
  await refresh();
  const lt = SUM.lifetime;
  const rate = lt.t ? lt.c/lt.t*100 : 0;
  const col = rate>=70?'var(--ok)':rate>=60?'var(--warn)':'var(--bad)';
  $('#lifetime').innerHTML = [
    ['题库', SUM.total + ' 题'],
    ['累计作答', lt.t + ' 题'],
    ['累计正确率', lt.t ? `<span style="color:${col}">${rate.toFixed(1)}%</span>` : '—', '目标 ≥70%'],
    ['错题本', SUM.wrongCount + ' 题'],
  ].map(([k,v,s]) => `<div class="stat"><b>${v}</b><span>${k}${s?' · '+s:''}</span></div>`).join('');

  const H = SUM.history.slice().reverse();
  $('#histtbl').innerHTML = H.length
    ? `<tr><th>日期</th><th>模式</th><th>正确率</th><th class="num">得分</th><th class="num">用时</th></tr>` +
      H.map(h=>{
        const r = h.total ? h.correct/h.total*100 : 0;
        const c = r>=70?'var(--ok)':r>=60?'var(--warn)':'var(--bad)';
        const w = Math.max(2, Math.round(r));
        return `<tr><td>${esc(h.date)}</td><td>${esc(h.mode)}</td>
          <td><div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;max-width:110px;height:6px;background:var(--line);border-radius:3px;overflow:hidden">
              <i style="display:block;height:100%;width:${w}%;background:${c}"></i></div>
            <span style="color:${c};font-variant-numeric:tabular-nums">${r.toFixed(0)}%</span></div></td>
          <td class="num">${h.correct}/${h.total}</td><td class="num">${(h.minutes||0).toFixed(1)}分</td></tr>`;
      }).join('')
    : '<tr><td class="empty">还没有练习记录</td></tr>';

  const W = SUM.wrongItems;
  $('#wrongtbl').innerHTML = W.length
    ? `<tr><th class="num">错次</th><th>来源</th><th>题干</th><th>上次</th></tr>` +
      W.slice(0,60).map(w=>`<tr><td class="num"><span class="tag bad">×${w.wrongCount}</span></td>
        <td>${esc(w.year)}</td><td>${esc((w.stem||'').slice(0,52))}${(w.stem||'').length>52?'…':''}</td>
        <td style="color:var(--muted)">${esc(w.lastWrong||'')}</td></tr>`).join('')
    : '<tr><td class="empty">错题本是空的</td></tr>';

  show('stats');
  window.scrollTo({top:0});
}

// ---------- 键盘 ----------
document.addEventListener('keydown', e => {
  if($('#quiz').classList.contains('hidden')) return;
  const k = e.key.toUpperCase();
  if(!S) return;
  if(!S.locked && ['A','B','C','D'].includes(k)){ e.preventDefault(); answer(k); }
  else if(!S.locked && ['1','2','3','4'].includes(k)){ e.preventDefault(); answer('ABCD'[+k-1]); }
  else if(k === 'ENTER' || k === ' '){ e.preventDefault(); if(S.locked) next(); }
  else if(k === 'ESCAPE'){ e.preventDefault(); finish(); }
});

refresh().catch(e => $('#topmeta').textContent = '加载失败：' + e.message);
</script>
</body>
</html>
